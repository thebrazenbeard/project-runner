[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-runner"
version = "0.1.0"
description = "Public-safe orchestration kernel for a multi-repository project ecosystem"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[project.scripts]
project-runner = "runner.cli:entrypoint"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["runner", "runner._schemas", "runner._data.policy", "runner._data.registry", "runner._data.topology", "runner._data.portfolio"]

[tool.setuptools.package-dir]
"runner._schemas" = "schemas"
"runner._data.policy" = "policy"
"runner._data.registry" = "registry"
"runner._data.topology" = "topology"
"runner._data.portfolio" = "portfolio"

[tool.setuptools.package-data]
"runner._schemas" = ["*.json"]
"runner._data.policy" = ["scheduling.yaml"]
"runner._data.registry" = ["projects.yaml", "workers.yaml"]
"runner._data.topology" = ["dependencies.yaml"]
"runner._data.portfolio" = ["advancement_wave.public.json", "corpus.public.json"]
