name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Validate registries
        run: project-runner validate
      - name: Live read-only GitHub backend smoke
        env:
          PROJECT_RUNNER_GITHUB_TOKEN: ${{ github.token }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          PR_EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: project-runner github-read-smoke --repository "$PR_REPOSITORY" --ref "$PR_REF" --expected-head "$PR_EXPECTED_HEAD"
      - name: M6 live reference worker proof
        env:
          PROJECT_RUNNER_GITHUB_TOKEN: ${{ github.token }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          PR_EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python scripts/m6_reference_worker_live_proof.py
      - name: M6 two-level recursive restart proof
        run: python scripts/m6_recursive_restart_proof.py
      - name: M6 live HC to Transcendence proof
        if: github.event_name == 'push'
        env:
          PROJECT_RUNNER_GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/m6_hc_transcendence_live_proof.py

  task-monitor-windows:
    runs-on: windows-latest
    steps:
      - name: Check out exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Exercise registered Windows task monitor
        shell: pwsh
        run: |
          $tasksRoot = Join-Path $env:RUNNER_TEMP "project-runner-task-monitor"
          .\scripts\Start-ProjectRunnerTask.ps1 `
            -Name "ci-task-monitor" `
            -Owner "github-actions" `
            -Repository "$env:GITHUB_REPOSITORY" `
            -Lane "windows-ci" `
            -TasksRoot $tasksRoot `
            -Command "Start-Sleep -Seconds 20" | Out-Null
          $snapshot = .\scripts\Watch-ProjectRunnerTasks.ps1 -TasksRoot $tasksRoot -Once | Out-String
          Write-Host $snapshot
          if ($snapshot -notmatch "RUNNING") {
            throw "task monitor did not observe the registered process as RUNNING"
          }
          project-runner task-status --tasks-root $tasksRoot
          Start-Sleep -Seconds 21
          $orphanSnapshot = .\scripts\Watch-ProjectRunnerTasks.ps1 -TasksRoot $tasksRoot -Once | Out-String
          Write-Host $orphanSnapshot
          if ($orphanSnapshot -notmatch "ORPHANED") {
            throw "task monitor did not render an exited registered process as ORPHANED"
          }
          if ($orphanSnapshot -match "INVALID_RECORD") {
            throw "task monitor misclassified a valid orphaned record as INVALID_RECORD"
          }
