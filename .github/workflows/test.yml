name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Validate registries
        run: project-runner validate
      - name: Live read-only GitHub backend smoke
        if: github.event_name == 'push'
        env:
          PROJECT_RUNNER_GITHUB_TOKEN: ${{ github.token }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_REF: ${{ github.ref_name }}
          PR_EXPECTED_HEAD: ${{ github.sha }}
        run: project-runner github-read-smoke --repository "$PR_REPOSITORY" --ref "$PR_REF" --expected-head "$PR_EXPECTED_HEAD"
      - name: M6 two-level recursive restart proof
        run: python scripts/m6_recursive_restart_proof.py
      - name: M6 live HC to Transcendence proof
        if: github.event_name == 'push'
        env:
          PROJECT_RUNNER_GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/m6_hc_transcendence_live_proof.py
