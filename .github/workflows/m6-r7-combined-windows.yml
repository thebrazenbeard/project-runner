name: M6 R7 combined Windows qualification

on:
  push:
    branches:
      - qualification/m6-r7-combined-windows-20260919

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out exact qualification subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Assert code subject
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "209425220db1d36a9ed7d62e93b0cc04f69b2ca1"
          changed="$(git diff --name-only 209425220db1d36a9ed7d62e93b0cc04f69b2ca1..HEAD)"
          test "$changed" = ".github/workflows/m6-r7-combined-windows.yml"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Full suite
        run: python -m pytest -q
      - name: Validate registries
        run: project-runner validate
      - name: Compile
        run: python -m compileall -q runner tests scripts
      - name: Recursive restart proof
        run: python scripts/m6_recursive_restart_proof.py
      - name: Diff check
        shell: bash
        run: git diff --check 209425220db1d36a9ed7d62e93b0cc04f69b2ca1..HEAD
